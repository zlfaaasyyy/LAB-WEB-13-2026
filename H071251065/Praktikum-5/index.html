<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugas-Bab 5</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 font-sans text-gray-900">
  <div class="mx-auto flex max-w-6xl flex-col gap-4 p-4 md:flex-row md:p-6">

    <!-- Sidebar-->
    <aside class="w-full shrink-0 rounded-xl border border-gray-200 bg-white p-4 shadow-sm md:w-64 md:self-start">
      <h1 class="text-lg font-bold">Tim Marsha</h1>
      <p class="mt-3 text-xs font-medium text-gray-500">Anggota</p>
      <p id="statusAnggota" class="mt-2 text-sm text-gray-500"></p>
      <div id="daftarAnggota" class="mt-2 flex flex-col gap-1"></div>
    </aside>

    <main class="min-w-0 flex-1 rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
      <p id="placeholder" class="py-16 text-center text-sm text-gray-500">
        Pilih nama anggota di daftar untuk melihat tugasnya.
      </p>

      <section id="panelTugas" class="hidden">
        <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
          <div>
            <h2 id="judulTugas" class="text-2xl font-bold"></h2>
            <p id="ringkasan" class="mt-1 text-sm text-gray-500"></p>
          </div>
          <div class="h-1.5 w-full overflow-hidden rounded-full bg-gray-200 sm:mt-3 sm:w-40">
            <div id="progressBar" class="h-full rounded-full bg-green-600 transition-all" style="width: 0%"></div>
          </div>
        </div>

        <div class="mt-5 flex flex-col gap-3 md:flex-row">
          <input id="cari" type="text" placeholder="Cari judul tugas" autocomplete="off"
            class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 md:w-1/3">
          <form id="formTambah" class="flex flex-1 gap-3" novalidate>
            <input id="inputJudul" type="text" placeholder="Tambah tugas baru, minimal 5 karakter" autocomplete="off"
              class="min-w-0 flex-1 rounded-lg border border-gray-200 px-3 py-2 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 disabled:bg-gray-50">
            <button id="tombolSimpan" type="submit"
              class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:bg-blue-300">
              Simpan
            </button>
          </form>
        </div>
        <p id="pesanForm" class="mt-2 hidden text-sm text-red-600" role="alert"></p>
        <p id="notifikasi" class="mt-2 hidden rounded-lg bg-green-50 px-3 py-2 text-sm text-green-700" role="status"></p>

        <p id="statusTugas" class="mt-4 text-sm text-gray-500"></p>
        <ul id="daftarTugas" class="mt-2"></ul>
        <p id="pesanKosong" class="hidden py-6 text-center text-sm text-gray-500"></p>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
